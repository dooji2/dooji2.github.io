<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Plants vs. Zombies</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}ruffle-player{width:100%;height:100%}</style>
<script src="/ruffle/ruffle.js"></script>
<script>
addEventListener('DOMContentLoaded', async () => {
  const player = window.RufflePlayer.newest().createPlayer();
  document.body.append(player);
  const api = player.ruffle();
  const volume = () => {api.volume = new URLSearchParams(location.search).get('muted') === 'true' ? 0 : 1;};
  addEventListener('message', event => {
    if (event.source === parent && event.origin === location.origin && typeof event.data.muted === 'boolean') api.volume = event.data.muted ? 0 : 1;
  });
  try {
    await api.load({url: 'pvz_9_15.swf', base: new URL('.', location.href).href, autoplay: 'on', backgroundColor: '#000000', letterbox: 'on', splashScreen: false, preloader: false, unmuteOverlay: 'hidden', contextMenu: 'off', allowScriptAccess: false, openUrlMode: 'deny'});
    volume();
    parent.postMessage({pvz: 'ready'}, location.origin);
  } catch {
    parent.postMessage({pvz: 'error'}, location.origin);
  }
});
addEventListener('pointerdown', () => parent.postMessage({pvz: 'focus'}, location.origin));
addEventListener('contextmenu', event => event.preventDefault());
</script>
<body></body>
</html>
